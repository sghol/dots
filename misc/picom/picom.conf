
# Smooth transition
vsync = true;
backend = "glx";
shadow = false;

# Fade
fading = false;
fade-in-step = 0.1;
fade-out-step = 0.1;

# Transparency / Opacity 
active-opacity = 1.0;
inactive-opacity = 1.0;
opacity-rule = [
    "100:window_type = 'utility'",
    "100:class_i = 'kitty'",
];

# Enable blur
blur = true;
blur-method = "dual_kawase";
blur-strength = 8;
blur-size = 20
blur-background-exclude = [
  "class_g = 'firefox' && window_type = 'utility'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
];
