<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Open Sans</string>
            <string>Vazir</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Open Sans</string>
            <string>Vazir</string>
        </edit>
    </match>

    <!-- Force Vazir for sans -->
    <match target="pattern">
        <test name="family" compare="eq">
            <string>sans</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Open Sans</string>
            <string>Vazir</string>
        </edit>
    </match>

    <!-- Keep your monospace preference -->
    <match target="pattern">
        <test name="family" compare="eq">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Monosapce Krypton</string>
            <string>Noto Sans Mono</string>
            <string>Vazir Code</string>
            <string>Libeartion Mono</string>
            <string>Source Code Pro</string>
        </edit>
    </match>

</fontconfig>
